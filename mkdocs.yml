site_name: AI Learning Group
site_dir: site
docs_dir: docs
use_directory_urls: true

theme:
  name: material
  palette:
    scheme: default
    primary: indigo
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.action.top
    - content.code.copy
    - navigation.path
    - search.suggest
    - search.highlight
  font:
    text: Roboto
    code: Roboto Mono

markdown_extensions:
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.pathconverter
  - attr_list
  - pymdownx.highlight:
      pygments_lang_class: true
extra_css:
  - css/extra.css

plugins:
  - search
  - mkdocs-pdf
  - mkdocs-jupyter:
      execute: true

nav:
  - Home: README.md

  - Learning Pathways:
    - _learning-pathways/00-start-here.md
    - _learning-pathways/01-ai-python-roadmap.md

