site_name: AI Learning Group
site_dir: site
docs_dir: docs\ 
use_directory_urls: true 

theme:
  name: material

  palette:
    scheme: default #slate #> dark mode
    primary: indigo
    accent: blue

  features:
      # Makes the main navigation items appear as a top bar for a cleaner look
      - navigation.tabs
      # Keeps the table of contents visible while scrolling
      - toc.follow
      # Enables the "Back to top" button
      - content.action.top
      # Adds a copy button to code blocks (great motivation for users to try code!)
      - content.code.copy
      # Shows the hierarchy of the current page in the header
      - navigation.path
      # Expands all navigation sections by default
      #- navigation.expand

  font:
    text: Roboto
    code: Roboto Mono


markdown_extensions:
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.tabbed
  - pymdownx.pathconverter
  - attr_list
extra_css:
  - css\extra.css
plugins:
  - search
  - mkdocs-pdf
  - mkdocs-jupyter:
      execute: true

nav:
  - Home: README.md

